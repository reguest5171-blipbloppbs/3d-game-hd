<main class="relative w-full h-full h-screen overflow-hidden bg-slate-900 select-none">
  <!-- 1. 3D WebGL Canvas Container -->
  <div #viewport class="absolute inset-0 w-full h-full z-0 touch-none"></div>

  <!-- 2. Transparent HUD (Top Bar & Tool Belt) without blur -->
  <app-hud class="z-10" />

  <!-- 3. Bottom Controls Layer (Landscape layout) -->
  <div class="absolute inset-x-0 bottom-0 z-20 pointer-events-none flex items-end justify-between p-3 sm:p-5 safe-area-inset">
    <!-- Left: Virtual Joystick (Transparent without blur) -->
    <div class="pointer-events-auto">
      <app-virtual-joystick />
    </div>

    <!-- Center: Initial Quick Controls Guide (dismissible) -->
    @if (showGuide()) {
      <button
        type="button"
        (click)="dismissGuide()"
        class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full border border-white/20 bg-black/40 text-white/90 text-[10px] font-semibold tracking-tight shadow-md cursor-pointer pointer-events-auto transition-opacity"
      >
        <mat-icon class="text-sm text-amber-300">touch_app</mat-icon>
        <span>Gunakan Joystick untuk jalan · Tombol Kanan untuk Aksi (Cangkul, Siram, Bicara)</span>
        <span class="text-white/40">✕</span>
      </button>
    }

    <!-- Right: All-in-One Action Button & Quick Tool Switcher (Transparent without blur) -->
    <div class="pointer-events-auto">
      <app-action-button />
    </div>
  </div>

  <!-- 4. Area Switching Smooth Blackout Transition (Tree of Tranquility style) -->
  @if (gameState.isFading()) {
    <div
      class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black transition-opacity duration-300 pointer-events-auto select-none"
    >
      <div class="flex flex-col items-center gap-3">
        <mat-icon class="text-4xl text-amber-300 animate-spin" style="animation-duration: 3s;">
          spa
        </mat-icon>
        <div class="text-base font-black text-amber-200 uppercase tracking-widest">
          {{ gameState.fadeMessage() }}
        </div>
        <div class="text-xs text-white/60 font-medium">
          Solaria Island
        </div>
      </div>
    </div>
  }

  <!-- 5. Modals & Overlays -->
  <app-dialogue />
  <app-shop-modal />
  <app-inventory-modal />
  <app-tool-modal />
  <app-sleep-modal />
  <app-map-modal />
  <app-settings-modal />
  <app-perf-modal />

  <!-- 6. Mobile Portrait Guard (Wajib Landscape) -->
  <app-landscape-guard />
</main>
